| eval mode=if(used_ui=0, "`exec_health_ai_mode`", coalesce(cfg_mode, "off")) \
| where mode="provider" \
| lookup dq_agent_ai_providers provider OUTPUT provider_label, default_endpoint \
| eval endpoint=if(endpoint="none" OR isnull(endpoint) OR endpoint="", coalesce(default_endpoint, "none"), endpoint) \
| table requested_at, finding_id, entity, issue, provider, provider_label, model, endpoint, ai_brief, status, actor, note
description = Lists pending human-approved ASK requests for the configured AI provider. Enable this search only after you set exec_health_ai_mode=provider, then attach a webhook action in Splunk Web to your gateway. Do not put webhook URLs, API keys, or HEC tokens in this app. The search never calls a provider itself and never changes Splunk configuration.
action.email = 0
alert.digest_mode = 1
alert.expires = 24h
alert.severity = 3
alert.suppress = 1
alert.suppress.period = 5m
alert.track = 1
alert_comparator = greater than
alert_threshold = 0
alert_type = number of events
cron_schedule = */5 * * * *
dispatch.earliest_time = -15m
dispatch.latest_time = now
display.general.type = statistics
display.page.search.tab = statistics
enableSched = 0
realtime_schedule = 1
request.ui_dispatch_view = search
schedule_window = auto
