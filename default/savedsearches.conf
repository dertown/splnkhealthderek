# Scheduled alerts are disabled on install so this app cannot email or page
# until an admin enables them and configures notification settings in Splunk Web.
# Do not store SMTP passwords, API tokens, or Slack webhook URLs in this file.

[Exec Health - Ingestion below predicted lower bound]
cron_schedule = */15 * * * *
dispatch.earliest_time = -7d
dispatch.latest_time = @h
enableSched = 0
realtime_schedule = 1
schedule_window = auto
search = | tstats count as count where index=`exec_health_idx` earliest=-7d latest=@h by _time span=1h \
| timechart span=1h sum(count) as count \
| predict count as prediction future_timespan=0 holdback=0 upper95=upper lower95=lower algorithm=LLP5 \
| tail 1 \
| eval deviation_pct=if(prediction>0, round(((count-prediction)/prediction)*100, 1), 0) \
| where isnotnull(lower) AND count < lower
description = Fires when the last complete hour of indexed volume falls below the predict() 95% lower bound. Captures weekend/after-hours seasonality without a static GB threshold.
action.email = 0
action.email.sendcsv = 0
alert.digest_mode = 1
alert.expires = 24h
alert.severity = 4
alert.suppress = 1
alert.suppress.period = 1h
alert.track = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
request.ui_dispatch_view = search
display.general.type = statistics
display.page.search.tab = statistics

[Exec Health - Host volume 2-sigma drop]
cron_schedule = */15 * * * *
dispatch.earliest_time = -24h
dispatch.latest_time = now
enableSched = 0
realtime_schedule = 1
schedule_window = auto
search = | tstats count as events where index=`exec_health_idx` earliest=-24h latest=now by host _time span=15m \
| streamstats window=96 current=f avg(events) as mean_vol stdev(events) as stdev_vol by host \
| eval sigma=`exec_health_sigma`, lower_bound=mean_vol-(sigma*stdev_vol) \
| eval baseline_state=case(isnull(mean_vol),"WARMUP", isnotnull(stdev_vol) AND events < lower_bound AND mean_vol>10, "ALERT", 1=1, "OK") \
| where _time >= relative_time(now(), "-15m@m") \
| where baseline_state="ALERT" \
| eval z_score=if(stdev_vol>0, round((events-mean_vol)/stdev_vol, 2), 0) \
| table _time, host, events, mean_vol, stdev_vol, lower_bound, z_score, baseline_state
description = Per-host 15-minute volume vs a rolling 24-hour streamstats mean/stdev. Alerts when current volume is more than N standard deviations below the host baseline.
action.email = 0
alert.digest_mode = 1
alert.expires = 24h
alert.severity = 4
alert.suppress = 1
alert.suppress.fields = host
alert.suppress.period = 1h
alert.track = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
request.ui_dispatch_view = search
display.general.type = statistics
display.page.search.tab = statistics

[Exec Health - HEC token silence]
cron_schedule = */15 * * * *
dispatch.earliest_time = -2h
dispatch.latest_time = now
enableSched = 0
realtime_schedule = 1
schedule_window = auto
search = `exec_health_hec_metrics` \
| eval token=coalesce(series, name, token) \
| lookup hec_token_map token OUTPUT token_name, owner \
| eval token_label=coalesce(token_name, token) \
| bin _time span=1m \
| stats sum(ev) as events by _time, token, token_label, owner \
| streamstats window=60 avg(events) as avg_1h by token \
| eval is_silent=if(events=0, 1, 0) \
| streamstats window=`exec_health_hec_silence_min` sum(is_silent) as silent_minutes by token \
| sort 0 -_time \
| dedup token \
| eval avg_1h_eps=round(avg_1h, 2) \
| where avg_1h_eps >= `exec_health_hec_baseline_eps` AND silent_minutes >= `exec_health_hec_silence_min` \
| table token, token_label, owner, events, avg_1h_eps, silent_minutes
description = Flags HEC tokens whose 1-hour rolling average is at least the baseline EPS and that have been at 0 events for the configured silent minutes.
action.email = 0
alert.digest_mode = 1
alert.expires = 24h
alert.severity = 5
alert.suppress = 1
alert.suppress.fields = token
alert.suppress.period = 30m
alert.track = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
request.ui_dispatch_view = search
display.general.type = statistics
display.page.search.tab = statistics

[Exec Health - Host data silent with heartbeat]
cron_schedule = */15 * * * *
dispatch.earliest_time = -24h
dispatch.latest_time = now
enableSched = 0
realtime_schedule = 1
schedule_window = auto
search = | tstats latest(_time) as last_data where index=`exec_health_idx` earliest=-24h latest=now by host \
| append [| tstats latest(_time) as last_heartbeat where index=_internal earliest=-24h latest=now by host] \
| stats max(last_data) as last_data, max(last_heartbeat) as last_heartbeat by host \
| eval data_age_sec=now()-last_data, heartbeat_age_sec=now()-last_heartbeat \
| eval state=case(isnull(last_data) AND heartbeat_age_sec < `exec_health_heartbeat_sec`, "HEARTBEAT ONLY", data_age_sec > `exec_health_silence_sec` AND heartbeat_age_sec < `exec_health_heartbeat_sec`, "DATA SILENT", data_age_sec > `exec_health_silence_sec` AND heartbeat_age_sec > `exec_health_silence_sec`, "HOST DOWN", 1=1, "OK") \
| where state="DATA SILENT" OR state="HEARTBEAT ONLY" \
| eval last_data_received=strftime(last_data, "%Y-%m-%d %H:%M:%S"), last_internal_heartbeat=strftime(last_heartbeat, "%Y-%m-%d %H:%M:%S") \
| table host, last_data_received, last_internal_heartbeat, data_age_sec, heartbeat_age_sec, state
description = Distinguishes a host that is still phoning home in _internal from a host that has stopped sending indexed data.
action.email = 0
alert.digest_mode = 1
alert.expires = 24h
alert.severity = 4
alert.suppress = 1
alert.suppress.fields = host
alert.suppress.period = 1h
alert.track = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
request.ui_dispatch_view = search
display.general.type = statistics
display.page.search.tab = statistics

[Exec Health - MLTK host density outliers (optional)]
cron_schedule = 15 * * * *
dispatch.earliest_time = -7d
dispatch.latest_time = now
enableSched = 0
realtime_schedule = 0
schedule_window = auto
search = | tstats count as events where index=`exec_health_idx` earliest=-7d latest=now by host _time span=1h \
| fit DensityFunction events by host dist=auto threshold=0.01 into exec_health_ingestion_baseline
description = OPTIONAL. Requires Splunk Machine Learning Toolkit. Rebuilds a per-host DensityFunction model. Leave disabled unless MLTK is installed and you have write access to this app's ML models.
action.email = 0
alert.track = 0
request.ui_dispatch_view = search
display.general.type = statistics
display.page.search.tab = statistics

[Exec Health - MLTK apply host outliers (optional)]
cron_schedule = */15 * * * *
dispatch.earliest_time = -2h
dispatch.latest_time = now
enableSched = 0
realtime_schedule = 1
schedule_window = auto
search = | tstats count as events where index=`exec_health_idx` earliest=-2h latest=now by host _time span=15m \
| apply exec_health_ingestion_baseline \
| where isOutlier=1 \
| table _time, host, events, isOutlier
description = OPTIONAL. Requires MLTK and a previously fitted exec_health_ingestion_baseline model. Apply-time outlier check against the density model.
action.email = 0
alert.digest_mode = 1
alert.expires = 24h
alert.severity = 3
alert.track = 1
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
request.ui_dispatch_view = search
display.general.type = statistics
display.page.search.tab = statistics
