[Exec Health Cache - Knowledge object usage]
search = search index=_internal (((sourcetype=splunk_web_access OR sourcetype=splunkd_ui_access) method=GET status=200) OR (sourcetype=scheduler savedsearch_name=*)) \
| rex field=uri_path "/app/(?<web_app>[^/]+)/" \
| rex field=uri_path "/app/(?<view_app>[^/]+)/(?<web_view>[^/?]+)$" \
| eval web_view=if(match(web_view, "^(search|reports|dashboards|alerts|home|job_manager|job_management|report|alert|search_job_inspector)$"), null(), web_view) \
| eval key=if(sourcetype="scheduler", "ss|".coalesce(app, "-")."|".savedsearch_name, mvappend(if(isnotnull(web_app) AND web_app!="-" AND web_app!="launcher", "app|".web_app."|".web_app, null()), if(isnotnull(web_view), "view|".view_app."|".web_view, null()))) \
| where isnotnull(key) \
| eval day=relative_time(_time, "@d") \
| stats max(_time) AS last_epoch, count AS views, values(user) AS users by key day \
| rex field=key "^(?<kind>[^|]+)\|(?<app_name>[^|]*)\|(?<ko_name>.*)$" \
| append [ \
    | makeresults \
    | addinfo \
    | eval kind="coverage", app_name="-", ko_name="-", day=relative_time(info_min_time, "@d"), views=0 \
] \
| eval fresh=1 \
| inputlookup append=true exec_health_cache_ko_usage \
| eventstats max(eval(if(fresh=1 AND kind="coverage", day, null()))) AS scan_day \
| where fresh=1 OR (day<scan_day AND day>=relative_time(now(), "-92d@d")) \
| table kind, app_name, ko_name, day, last_epoch, views, users \
| outputlookup exec_health_cache_ko_usage \
| stats count AS rows, min(eval(if(kind="coverage", day, null()))) AS covered_from \
| eval _key="ko_usage", dataset="ko_usage", cached_at=now() \
| outputlookup append=true key_field=_key exec_health_cache_meta
