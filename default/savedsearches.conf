] \
| eval fresh=1 \
| inputlookup append=true exec_health_cache_ko_usage \
| eventstats max(eval(if(fresh=1 AND kind="coverage", day, null()))) AS scan_day \
| where fresh=1 OR (day<scan_day AND day>=relative_time(now(), "-92d@d")) \
| table kind, app_name, ko_name, day, last_epoch, views, users \
| outputlookup exec_health_cache_ko_usage \
| stats count AS rows, min(eval(if(kind="coverage", day, null()))) AS covered_from \
| eval _key="ko_usage", dataset="ko_usage", cached_at=now() \
| outputlookup append=true key_field=_key exec_health_cache_meta
description = Run once by hand after install to load 90 days of knowledge-object usage into the cache, so the 30- and 90-day views read the cache right away. Without it, the cache builds up one day at a time and the page uses the live search until it covers the chosen window.
action.email = 0
alert.track = 0
allow_skew = 2m
dispatch.earliest_time = -90d@d
dispatch.latest_time = now
display.general.type = statistics
display.page.search.tab = statistics
enableSched = 0
request.ui_dispatch_view = search
schedule_window = auto
