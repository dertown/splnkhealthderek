[Exec Health - Host volume 2-sigma drop]
search = | tstats count as events where index=`exec_health_idx` earliest=-25h@m latest=@m by _time span=15m host \
| timechart span=15m limit=0 useother=f sum(events) as events by host \
| fillnull value=0 \
| untable _time host events \
| where _time+900+300 <= now() \
| streamstats window=96 current=f avg(events) as mean_vol stdev(events) as stdev_vol count as samples by host \
| eventstats max(_time) as scored_bucket \
| where _time=scored_bucket \
| eval sigma=`exec_health_sigma`, mean_vol=round(mean_vol, 1), stdev_vol=round(stdev_vol, 1), lower_bound=round(mean_vol-(sigma*stdev_vol), 1) \
| eval baseline_state=case(samples<8, "WARMUP", stdev_vol>0 AND events < lower_bound AND mean_vol>10, "ALERT", 1=1, "OK") \
| eval z_score=if(stdev_vol>0, round((events-mean_vol)/stdev_vol, 2), 0) \
| where baseline_state="ALERT" \
| table _time, host, events, mean_vol, stdev_vol, lower_bound, z_score, baseline_state
description = Per-host volume in the latest complete 15-minute bucket vs that host's prior 24 hours (zero-filled, so a host that drops to 0 events is caught). Alerts when volume is more than exec_health_sigma standard deviations below the host mean.
action.email = 0
alert.digest_mode = 0
alert.expires = 24h
alert.severity = 4
alert.suppress = 1
alert.suppress.fields = host
alert.suppress.period = 1h
alert.track = 1
alert_comparator = greater than
alert_threshold = 0
alert_type = number of events
cron_schedule = */15 * * * *
dispatch.earliest_time = -25h@m
dispatch.latest_time = @m
display.general.type = statistics
