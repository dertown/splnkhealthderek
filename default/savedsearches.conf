[Exec Health - Ingestion below predicted lower bound]
search = | tstats count as count where index=`exec_health_idx` earliest=-7d@h latest=@h by _time span=1h \
| timechart span=1h sum(count) as count \
| fillnull value=0 count \
| predict count as prediction future_timespan=0 holdback=0 upper95=upper lower95=lower algorithm=LLP5 \
| tail 1 \
| eval deviation_pct=if(prediction>0, round(((count-prediction)/prediction)*100, 1), 0) \
| where isnotnull(lower) AND count < lower
description = Fires when the last complete hour of indexed volume falls below the predict() 95% lower bound over the previous 7 days. Runs hourly (each run scores the hour that just closed), so weekend/after-hours seasonality is expected rather than flagged.
action.email = 0
alert.digest_mode = 1
alert.expires = 24h
alert.severity = 4
alert.suppress = 1
alert.suppress.period = 1h
alert.track = 1
alert_comparator = greater than
alert_threshold = 0
alert_type = number of events
cron_schedule = 7 * * * *
dispatch.earliest_time = -7d@h
dispatch.latest_time = @h
display.general.type = statistics
display.page.search.tab = statistics
enableSched = 0
realtime_schedule = 1
request.ui_dispatch_view = search
schedule_window = auto

[Exec Health - Host volume 2-sigma drop]
search = | tstats count as events where index=`exec_health_idx` earliest=-25h@m latest=@m by _time span=15m host \
| timechart span=15m limit=0 useother=f sum(events) as events by host \
| fillnull value=0 \
| untable _time host events \
| where _time+900+300 <= now() \
| streamstats window=96 current=f avg(events) as mean_vol stdev(events) as stdev_vol count as samples by host \
| eventstats max(_time) as scored_bucket \
| where _time=scored_bucket \
| eval sigma=`exec_health_sigma`, mean_vol=round(mean_vol, 1), stdev_vol=round(stdev_vol, 1), lower_bound=round(mean_vol-(sigma*stdev_vol), 1) \
| eval baseline_state=case(samples<8, "WARMUP", stdev_vol>0 AND events < lower_bound AND mean_vol>10, "ALERT", 1=1, "OK") \
| eval z_score=if(stdev_vol>0, round((events-mean_vol)/stdev_vol, 2), 0) \
| where baseline_state="ALERT" \
| table _time, host, events, mean_vol, stdev_vol, lower_bound, z_score, baseline_state
