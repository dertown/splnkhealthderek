# Scoped override so this app's dashboards can persist a human APPROVE or
# DISMISS row to dq_agent_approvals. Splunk Cloud otherwise refuses to run
# dashboard searches that contain outputlookup ("potential security risk").
# Do not mark other commands not-risky here.
[outputlookup]
is_risky = false

# Calls the configured AI provider over HTTPS from the search head. The API key
# is read from KV Store by the dashboard search and passed in the result row,
# never in the search string.
[derekaiping]
chunked = true
filename = derekaiping.py
python.version = python3
local = true
