# Tunable thresholds. Override in local/macros.conf — do not put secrets here.

[exec_health_idx]
definition = *
description = Index glob used by tstats panels. Override to a subset (e.g. main OR security) to reduce search load.

[exec_health_sigma]
definition = 2
description = Number of standard deviations below the host baseline that triggers an ALERT state.

[exec_health_hec_baseline_eps]
definition = 100
description = Rolling 1-hour average events/sec a HEC token must usually send before a drop-to-zero is treated as RED.

[exec_health_hec_silence_min]
definition = 5
description = Consecutive silent minutes required before a previously busy HEC token is flagged.

[exec_health_silence_sec]
definition = 3600
description = Seconds without indexed data before a host is treated as DATA SILENT.

[exec_health_heartbeat_sec]
definition = 600
description = Seconds without _internal events before a host is treated as missing a heartbeat.

[exec_health_drop_red_pct]
definition = 50
description = Percent below the 7-day moving average that marks ingestion RED.

[exec_health_drop_yellow_pct]
definition = 20
description = Percent below the 7-day moving average that marks ingestion YELLOW.

[exec_health_license_usage]
definition = index=_internal source=*license_usage.log* type=Usage
description = License usage events used for GB/day ingestion. No credentials are read from this log.

[exec_health_hec_metrics]
definition = index=_internal sourcetype=splunkd source=*metrics.log group=http
description = HEC throughput from metrics.log (series = token).

[exec_health_hec_handler]
definition = index=_internal sourcetype=splunkd component=HttpInputDataHandler
description = HttpInputDataHandler component logs for HEC errors and token activity.

[exec_health_sc4s]
definition = (sourcetype=sc4s* OR sourcetype=*syslog* OR sourcetype=syslog:sc4s OR source=*sc4s*)
description = Sourcetype/source filter for SC4S and syslog streams.

[exec_health_edge_mstats]
definition = index=_metrics sourcetype=edge-metrics
description = Edge Processor metrics sourcetype in the _metrics index.
