# Tunable thresholds. Override in local/macros.conf — do not put secrets here.

[exec_health_idx]
definition = *
description = Index glob used by tstats panels. On Splunk Cloud, override to the indexes your role can search (e.g. main) if index=* is too wide.

[exec_health_sc4s_idx]
definition = *
description = Index glob for SC4S/syslog event (non-tstats) error panels. Narrow this on Splunk Cloud to avoid expensive index=* scans.

[exec_health_sigma]
definition = 2
description = Number of standard deviations below the host baseline that triggers an ALERT state.

[exec_health_hec_baseline_eps]
definition = 100
description = Rolling 1-hour average events/sec a HEC token must usually send before a drop-to-zero is treated as RED.

[exec_health_hec_silence_min]
definition = 5
description = Consecutive silent minutes required before a previously busy HEC token is flagged.

[exec_health_silence_sec]
definition = 3600
description = Seconds without indexed data before a host is treated as DATA SILENT.

[exec_health_heartbeat_sec]
definition = 600
description = Seconds without _internal events before a host is treated as missing a heartbeat.

[exec_health_drop_red_pct]
definition = 50
description = Percent below the 7-day moving average that marks ingestion RED.

[exec_health_drop_yellow_pct]
definition = 20
description = Percent below the 7-day moving average that marks ingestion YELLOW.

[exec_health_license_usage]
definition = index=_internal source=*license_usage.log* type=Usage
description = License usage events used for GB/day ingestion. No credentials are read from this log.

[exec_health_health_report]
definition = index=_internal source=*health.log component=PeriodicHealthReporter
description = splunkd health report (health.log). PeriodicHealthReporter writes feature and color for every feature on every instance at a fixed interval.

[exec_health_hec_metrics]
definition = index=_introspection sourcetype=http_event_collector_metrics data.series=http_event_collector_token
description = Per-token HEC metrics (http_event_collector_metrics.log, one record per active token per metrics_report_interval, default 60s). Tokens that send nothing write no record, so searches zero-fill.

[exec_health_hec_normalize]
definition = eval token='data.token_name', hec_events='data.num_of_events', hec_bytes='data.total_bytes_received'
description = Maps HEC per-token metric fields to token, hec_events, and hec_bytes. token is the HEC input name, never the token secret.

[exec_health_hec_handler]
definition = index=_internal sourcetype=splunkd component=HttpInputDataHandler
description = HttpInputDataHandler splunkd.log lines (failed HEC requests). The token is parsed from "token name=".

[exec_health_sc4s]
definition = (sourcetype=sc4s* OR sourcetype=*syslog* OR source=*sc4s*)
description = Sourcetype/source filter for SC4S and syslog streams. Leading wildcards are slow: replace with your exact SC4S sourcetypes if you know them.

[exec_health_edge_mstats]
definition = index=_metrics
description = Index holding Edge Processor metrics (processor_events_in_total and related). Add a host or sourcetype filter if other metrics share the index.

# Optional AI provider. Default is local briefing only. Never put API keys, tokens, or webhook URLs here.

[exec_health_ai_mode]
definition = off
description = AI provider mode: off (local briefing only) or provider (call the provider after a human clicks ASK). Override in local/macros.conf. Do not put API keys here.

[exec_health_ai_provider]
definition = none
description = Provider id from dq_agent_ai_providers.csv: none, openai, cisco, azure, anthropic, or custom. Override in local/macros.conf.

[exec_health_ai_model]
definition = none
description = Model name sent to the provider (for example gpt-4o-mini). Do not put API keys here.

[exec_health_ai_endpoint]
definition = none
description = Provider chat URL, or none to use the playbook default. Cisco AI Defense needs your tenant/connection URL. Do not put API keys here.

[exec_health_ai_inbox]
definition = index=_internal sourcetype=derek_health_ai_unconfigured
description = Legacy search for replies delivered through HEC. Not used by SAVE or ASK, which call the provider directly. Do not put API keys or HEC secrets here.
