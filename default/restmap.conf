# HTML dashboard data. Runs named searches as the signed-in user.
[script:healthdash]
match                 = /data/healthdash
script                = healthdash.py
scripttype            = persist
handler               = healthdash.HealthDashHandler
requireAuthentication = true
output_modes          = json
passPayload           = true
python.version        = python3
# python.required is the Splunk 10.2+ setting; python.version stays for older stacks.
python.required       = 3.13, 3.14
