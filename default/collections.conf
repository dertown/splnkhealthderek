# KV Store collections. They live outside the app package, so the saved AI provider
# settings and recorded APPROVE/DISMISS decisions survive app updates. Do not put
# secrets in this file or in KV Store: the AI provider key is kept in storage/passwords,
# and dq_agent_ai_config only records api_key="stored" and key_len.
[dq_agent_ai_config]
enforceTypes = false
replicate = true
field.stanza = string
field.mode = string
field.provider = string
field.model = string
field.endpoint = string
field.api_key = string
field.key_len = number
field.inbox_index = string
field.inbox_sourcetype = string
field.updated_by = string
field.updated_at = string
field.note = string

# Human APPROVE / DISMISS decisions for agent findings. One record per finding_id.
[dq_agent_approvals]
enforceTypes = false
replicate = true
field.finding_id = string
field.decision = string
field.actor = string
field.decided_at = string
field.note = string
field.entity = string

# Every AI suggested fix, one record per reply. Connection tests and failures are not saved.
[dq_agent_ai_suggestions]
enforceTypes = false
replicate = true
field.suggested_at = string
field.finding_id = string
field.entity = string
field.issue = string
field.provider = string
field.model = string
field.actor = string
field.suggestion = string
field.recurring = string
field.first_suggested_at = string
field.earlier_suggestions = string
field.previous_suggestion = string

# BEGIN result caches (generated by tools/build_dashboards.py)
# Cached panel results written by the Exec Health Cache searches. Not replicated to
# indexers; only the search head reads them. Safe to empty: the next run refills them.
[exec_health_cache_meta]
enforceTypes = false
replicate = false

[exec_health_cache_areas]
enforceTypes = false
replicate = false

[exec_health_cache_dq_findings]
enforceTypes = false
replicate = false

[exec_health_cache_baseline]
enforceTypes = false
replicate = false

[exec_health_cache_heartbeat]
enforceTypes = false
replicate = false

[exec_health_cache_host_season]
enforceTypes = false
replicate = false

[exec_health_cache_index_season]
enforceTypes = false
replicate = false

[exec_health_cache_empty_hours]
enforceTypes = false
replicate = false

[exec_health_cache_topo_full]
enforceTypes = false
replicate = false

[exec_health_cache_ko_usage]
enforceTypes = false
replicate = false
# END result caches
