# KV Store collections. They live outside the app package, so SAVE'd API keys and
# recorded APPROVE/DISMISS decisions survive app updates. Do not put secrets in this file.
[dq_agent_ai_config]
enforceTypes = false
replicate = true
field.stanza = string
field.mode = string
field.provider = string
field.model = string
field.endpoint = string
field.api_key = string
field.inbox_index = string
field.inbox_sourcetype = string
field.updated_by = string
field.updated_at = string
field.note = string

# Human APPROVE / DISMISS decisions for agent findings. One record per finding_id.
[dq_agent_approvals]
enforceTypes = false
replicate = true
field.finding_id = string
field.decision = string
field.actor = string
field.decided_at = string
field.note = string
field.entity = string
